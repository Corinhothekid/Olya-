<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1516">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>PolyLax | Field Lacrosse</title>
    <style>
        :root { color-scheme: dark; background: #081214; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
        #field { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
        #renderCanvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
        #boot { position: absolute; z-index: 5; inset: 0; display: grid; place-content: center;
            padding: 32px; text-align: center; color: #e7f2dd; background: #081214;
            font: 600 17px/1.45 system-ui, sans-serif; pointer-events: none; }
        #boot[hidden] { display: none; }
    </style>
</head>
<body>
    <main id="field" aria-label="PolyLax browser game">
        <canvas id="renderCanvas" aria-label="Lacrosse field" tabindex="0"></canvas>
        <div id="boot" role="status">Loading the field…</div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@8.32.0/babylon.js"></script>
    <script src="playground.js"></script>
    <script>
        const canvas = document.getElementById('renderCanvas');
        const boot = document.getElementById('boot');
        try {
            if (!window.BABYLON) throw new Error('Babylon.js could not load. Check your connection and reload.');
            if (!BABYLON.Engine.isSupported()) throw new Error('This browser could not start WebGL.');
            window.engine = new BABYLON.Engine(canvas, true, {stencil: true, preserveDrawingBuffer: false});
            const scene = createScene();
            window.polylaxScene = scene;
            engine.runRenderLoop(() => scene.render());
            window.addEventListener('resize', () => engine.resize());
            boot.hidden = true;
        } catch (error) {
            boot.textContent = error.message;
            console.error(error);
        }
    </script>
</body>
</html>
